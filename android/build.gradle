buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Load Flutter properties for legacy plugins
def flutterPropertiesFile = rootProject.file("gradle.properties")
def flutterProperties = new Properties()
if (flutterPropertiesFile.exists()) {
    flutterPropertiesFile.withReader("UTF-8") { reader ->
        flutterProperties.load(reader)
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { subproject ->
    // Only inject for plugins that aren't the main app
    if (subproject.name != 'app') {
        subproject.ext {
            flutter = [
                compileSdkVersion: Integer.parseInt(flutterProperties.getProperty('flutter.compileSdkVersion', '35')),
                targetSdkVersion: Integer.parseInt(flutterProperties.getProperty('flutter.targetSdkVersion', '35')),
                ndkVersion: flutterProperties.getProperty('flutter.ndkVersion', '25.1.8937393')
            ]
        }
        
        // Force newer Kotlin version for all plugins
        subproject.buildscript {
            ext.kotlin_version = '1.9.22'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
        }
        
        // Add namespace for plugins that don't have it (like sms_advanced)
        subproject.afterEvaluate {
            if (subproject.plugins.hasPlugin('com.android.library')) {
                android {
                    if (namespace == null) {
                        namespace "com.${subproject.name}"
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
